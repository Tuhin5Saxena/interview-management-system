<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interviewers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 25px;
        }

        .interviewer-card {
            background: white;
            padding: 18px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
        }

        .interviewer-card strong {
            color: #1e293b;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 8px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>All Interviewers</h2>

        {% for interviewer in interviewers %}

            <div class="interviewer-card">
                <strong>{{ interviewer }}</strong>
            </div>

        {% empty %}

            <div class="empty">
                No interviewers found.
            </div>

        {% endfor %}
        {%if is_hr%}

        <a href="{% url 'dashboard' %}" class="back-btn">
            Back to HR Dashboard
        </a>
        {%endif%}

    </div>

</body>
</html>
